replicaCount: 1
image:
  repository: pulseguard-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent
service:
  type: LoadBalancer
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  host: pulseguard.local
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
