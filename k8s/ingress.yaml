apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulseguard-api
  namespace: pulseguard
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: pulseguard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulseguard-api
                port:
                  number: 80
